name: cousin_hub
description: "Cousin Hub — Private family app by JroNex"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  firebase_database: ^11.1.0
  firebase_messaging: ^15.1.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.8.2
  cached_network_image: ^3.4.1
  file_picker: ^8.1.2

  # Network
  http: ^1.2.2
  crypto: ^3.0.3

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Calls (Agora)
  agora_rtc_engine: ^6.3.2

  # WebView (Ludo King)
  webview_flutter: ^4.4.4

  # Voice recording
  record: ^6.1.2
  audioplayers: ^6.1.0

  # Permissions
  permission_handler: ^11.3.1
  open_file: ^3.3.2

  # UI
  emoji_picker_flutter: ^3.1.0
  intl: ^0.19.0

  # Map (Live Location)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Deep Links
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
     - assets/icon/
